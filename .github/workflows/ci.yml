name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.7' }
      - name: Lint + debug APK (no signing credentials needed)
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:lintDebug :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-debug.log
      - name: Explain failure (annotations)
        if: failure()
        run: .github/ci-annotate.sh gradle-debug.log "android lint/debug build"
      - name: Release build check (R8 + resource shrinking)
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-release.log   # falls back to the debug key and warns when no secrets exist
      - name: Explain failure (annotations)
        if: failure()
        run: .github/ci-annotate.sh gradle-release.log "android release build"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  pc-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          # Hosted runners sometimes get HTTP 503 from the Ubuntu package mirrors. APT retries each file itself
          # (Acquire::Retries), the whole update+install sequence is retried up to 3 times, and an incomplete
          # "apt-get update" (some index could not be fetched) counts as a failure (APT::Update::Error-Mode=any).
          PKGS="python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav xvfb openjdk-17-jdk-headless"
          APT_OPTS="-o Acquire::Retries=3 -o APT::Update::Error-Mode=any"
          for attempt in 1 2 3; do
            # One log per attempt, overwritten each time: after the last failed attempt it holds that attempt's output.
            if { sudo apt-get update $APT_OPTS && sudo apt-get install -y $APT_OPTS $PKGS; } > apt-attempt.log 2>&1; then
              tail -n 5 apt-attempt.log
              exit 0
            fi
            echo "::warning title=apt::attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then
              tail -n 15 apt-attempt.log
              sleep $((attempt * 30))
            fi
          done
          echo "apt failed 3 times; full output of the last attempt:"
          cat apt-attempt.log
          grep -E '^(E|W):' apt-attempt.log | head -n 8 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=apt::$line"; done
          exit 1
      - name: PC tests (allow optional prerequisites to be missing)
        env: { PHONEBRIDGE_STRICT: '0' }
        run: |
          set -o pipefail
          tools/run_tests.sh 2>&1 | tee pc-tests.log
      - name: Explain failure (annotations)
        if: failure()
        run: .github/ci-annotate.sh pc-tests.log "pc tests"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.7' }
      - name: Provision K0 Kotlin test prerequisites
        shell: bash
        run: |
          # Expose the action's Gradle installation and the hosted SDK at the paths the test runner searches.
          gradle_bin="$(readlink -f "$(command -v gradle)")"
          gradle_dist="$HOME/.gradle/wrapper/dists/gradle-8.14.7-bin/ci"
          mkdir -p "$gradle_dist" "$HOME/Android/Sdk/platforms"
          ln -sfn "${gradle_bin%/bin/gradle}" "$gradle_dist/gradle-8.14.7"
          sdk_platform="$ANDROID_HOME/platforms/android-35"
          if [ ! -r "$sdk_platform/android.jar" ]; then
            sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35'
          fi
          if [ ! -r "$HOME/Android/Sdk/platforms/android-35/android.jar" ]; then
            ln -sfn "$sdk_platform" "$HOME/Android/Sdk/platforms/android-35"
          fi
          fetch_jar() {
            local group="$1" artifact="$2" version="$3" dir
            dir="$HOME/.gradle/caches/modules-2/files-2.1/$group/$artifact/$version/ci"
            mkdir -p "$dir"
            curl --fail --silent --show-error --location --retry 3 \
              "https://repo.maven.apache.org/maven2/${group//./\/}/$artifact/$version/$artifact-$version.jar" \
              -o "$dir/$artifact-$version.jar"
          }
          fetch_jar org.json json 20240303
          fetch_jar org.bouncycastle bcprov-jdk18on 1.87
      - name: K0 Kotlin tests (strict)
        env: { PHONEBRIDGE_STRICT: '1' }
        timeout-minutes: 20
        run: |
          .venv-test/bin/python linux/tests/test_strict_environment.py
          .venv-test/bin/python linux/tests/test_kotlin_toolchain.py

  release:
    # Only for version tags, only in the upstream repository, only when the signing secrets exist. Secrets are written to
    # the runner's temp dir, never echoed, and removed afterwards.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository_owner == github.actor
    needs: [android, pc-tests]
    runs-on: ubuntu-24.04
    environment: release          # protect this environment with required reviewers in the repository settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.7' }
      - name: Build signed release
        env:
          KEYSTORE_B64: ${{ secrets.PHONEBRIDGE_KEYSTORE_B64 }}
          PHONEBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.PHONEBRIDGE_KEYSTORE_PASSWORD }}
          PHONEBRIDGE_KEY_ALIAS: ${{ secrets.PHONEBRIDGE_KEY_ALIAS }}
          PHONEBRIDGE_KEY_PASSWORD: ${{ secrets.PHONEBRIDGE_KEY_PASSWORD }}
        working-directory: android
        run: |
          set +x
          [ -n "$KEYSTORE_B64" ] || { echo "signing secrets not configured"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export PHONEBRIDGE_KEYSTORE="$RUNNER_TEMP/release.jks"
          gradle :app:assembleRelease :app:bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Verify signature and checksums
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep "SHA-256 digest"
          cd android/app/build/outputs && sha256sum apk/release/*.apk bundle/release/*.aab | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/SHA256SUMS
